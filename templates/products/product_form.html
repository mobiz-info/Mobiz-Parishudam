{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block page_subtitle %}Fill in the details below to save product information{% endblock %}

{% block content %}

<div class="premium-form-container">

    <div class="premium-form-title">
        <i class="ph-bold ph-package"></i> {{ title }}
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Product Name *</label>
            <input type="text" name="product_name" value="{{ product.product_name|default:'' }}" required>
        </div>

        <div class="form-group">
            <label>Unit *</label>

            <div style="display: flex; gap: 8px; align-items: center;">

                <select name="unit" id="unitSelect" required style="flex: 1;">
                    <option value="">Select Unit</option>

                    {% for unit in units %}
                    <option value="{{ unit.id }}" {% if product.unit_id == unit.id %}selected{% endif %}>
                        {{ unit.name }}
                    </option>
                    {% endfor %}

                </select>

                <a href="{% url 'unit_list' %}" class="btn-success">
                    <i class="ph-bold ph-plus"></i> Add Unit
                </a>

            </div>
        </div>

        <div class="form-actions">

            <a href="{% url 'product_list' %}" class="btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn-primary">
                Save Product
            </button>

        </div>

    </form>

</div>

{% endblock %}
