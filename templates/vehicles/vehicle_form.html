{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block page_subtitle %}Manage vehicle details{% endblock %}

{% block content %}

<div class="premium-form-container">

    <div class="premium-form-title">
        {{ title }}
    </div>

    <form method="POST">
        {% csrf_token %}

        <!-- Vehicle Number -->
        <div class="form-group">
            <label>Vehicle Number *</label>

            <input type="text"
                   name="vehicle_number"
                   value="{{ vehicle.vehicle_number|default:'' }}"
                   placeholder="e.g. KL-01-AB-1234"
                   required>
        </div>

        <!-- Vehicle Type -->
        <div class="form-group">
            <label>Vehicle Type *</label>

            <input type="text"
                   name="vehicle_type"
                   value="{{ vehicle.vehicle_type|default:'' }}"
                   placeholder="e.g. Van, Car, Bike"
                   required>
        </div>

        <!-- Branch -->
        <div class="form-group">
            <label>Branch *</label>

            <select name="branch" required>
                <option value="">Select Branch</option>

                {% for branch in branches %}
                <option value="{{ branch.id }}"
                    {% if vehicle and vehicle.branch_id == branch.id %}selected{% endif %}>
                    {{ branch.name }}
                </option>
                {% endfor %}

            </select>
        </div>

        <!-- Driver Name -->
        <div class="form-group">
            <label>Driver Name *</label>

            <input type="text"
                   name="driver_name"
                   value="{{ vehicle.driver_name|default:'' }}"
                   placeholder="Enter driver name"
                   required>
        </div>

        <!-- Driver Phone -->
        <div class="form-group">
            <label>Driver Phone Number *</label>

            <input type="number"
                   name="driver_phone"
                   value="{{ vehicle.driver_phone|default:'' }}"
                   placeholder="Enter Phone Number"
                   maxlength="10"
                   pattern="[6-9][0-9]{9}"
                   inputmode="numeric"
                   required>
        </div>

        <!-- Buttons -->
        <div class="form-actions">

            <a href="{% url 'vehicle_list' %}" class="btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn-primary">
                {% if vehicle %}
                    Update Vehicle
                {% else %}
                    Save Vehicle
                {% endif %}
            </button>

        </div>

    </form>

</div>

{% endblock %}
